[project]
name = "cellpose3-gpu-windows"
version = "0.1.0"
description = "Cellpose 3 on Windows via uv with CUDA 11.8 PyTorch (GPU)"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "cellpose[gui]==3.*",
    "torch==2.4.1+cu118",
    "torchvision==0.19.1+cu118",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }