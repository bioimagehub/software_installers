name: "Windows demo workflow"
defaults:
  timeout: inf
  confidence: 0.8

environment:
  buttonpath: './buttons'

steps:
  # 1) Launch a standard Windows program from the command line
  - cmd: 'C:\Windows\System32\mspaint.exe'
    background: true

  # 2) Wait until a matching window appears and bring it to the foreground
  - window: '* - Paint'
    timeout: 30s

  # 3) Pause briefly so the UI settles
  - wait: 3s

  # 4) Click a captured button image (example: Start/Apps button)
  - button: 'start'
    command: click
    timeout: 1m

  # 5) Type into the focused input, then press Enter
  - type: 'notepad'
    enter: true

  # 6) Repeat the sequence a few times to demonstrate looping
  - repeat:
      from: 2
      times: 3
      delay: 1s
